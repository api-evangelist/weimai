aid: weimai
name: WeiMai
description: >-
  WeiMai (微脉) is a Chinese healthcare technology company operated by Choice Technology
  Inc. and headquartered in Hangzhou. It runs an internet-based medical services
  marketplace and licensed internet hospitals (including Hainan WeiMai Internet Hospital)
  that connect patients with doctors for online consultation, pharmaceutical products,
  medical devices, and health-management service packages, delivered primarily through
  the WeiMai consumer mobile app. WeiMai also operates a partner-facing Open Platform
  (微脉开发平台) at openapi.myweimai.com that exposes a Swagger 2.0 API surface for approved
  integrators; the public specification is a minimal stub with no operations exposed
  without partner credentials. The company is backed by IDG Capital and was added to the
  API Evangelist network as a healthcare portfolio company.
